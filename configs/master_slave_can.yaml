gripper:
  enabled: true
  effector: AGX_GRIPPER
  attach_to: both
  teleop_enabled: true
  scale: 1.0
  offset_m: 0.0
  min_width_m: 0.0
  max_width_m: 0.1
  force_n: 1.0
  command_rate_hz: 50.0
  deadband_m: 0.0005
  keepalive_s: 0.5

robot_states:
  q:
    enabled: true
    lowpass: false

  velocity:
    enabled: true
    lowpass: false

  acceleration:
    enabled: false
    lowpass: false

  ee_pose:
    enabled: true
    lowpass: false

  torque:
    enabled: true
    lowpass: false

  tau_id:
    enabled: false
    lowpass: false

  tau_id_filtered:
    enabled: false
    lowpass: false

  current:
    enabled: false
    lowpass: false









# q/dq/ddq/tau 均按对齐后的原始值保存；训练滤波只由 checkpoint 配置定义。
dynamics_processing:
  enabled: false
  state_method: finite_difference
  # finite_difference 模式下下面三项保留给旧 spline/fourier 配置，不参与当前数采。
  spline_smoothing_rad2: 1.0e-5
  fourier_fundamental_hz: 0.1
  fourier_harmonics: 8
  min_samples: 3
