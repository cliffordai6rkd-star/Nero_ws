gripper:
  enabled: true
  effector: AGX_GRIPPER
  attach_to: both
  teleop_enabled: true
  scale: 1.0
  offset_m: 0.0
  min_width_m: 0.0
  max_width_m: 0.1
  force_n: 1.0
  command_rate_hz: 30.0
  deadband_m: 0.0005
  keepalive_s: 0.5

robot_states:
  q:
    enabled: true
    # q 保存原始观测值；不再用滑动均值生成 dq。q 低通仅用于 ddq 的二阶导估计。
    mean_window: 1
    lowpass: true
    lowpass_cutoff_hz: 10.0

  velocity:
    enabled: true
    lowpass: true
    lowpass_cutoff_hz: 6.0

  acceleration:
    enabled: true
    lowpass: true
    lowpass_cutoff_hz: 3.0



  ee_pose:
    enabled: true
    lowpass: false

  torque:
    enabled: true
    # 因果一阶 IIR；H5 保存和实时预览使用同一类在线滤波
    lowpass: true
    lowpass_cutoff_hz: 10
    median_window: 1

  tau_id:
    enabled: true
    # q/dq/ddq 已在关节组状态估计器内低通；tau_id 不再追加 IIR。
    lowpass: false
    lowpass_cutoff_hz: 5
    median_window: 1

  current:
    enabled: true
    lowpass: false
    lowpass_cutoff_hz: 8
    median_window: 1









# q 保存原始值；dq 使用 V120 motor_state velocity，ddq 融合 dq 一阶导和 q 二阶导。
dynamics_processing:
  enabled: false
  state_method: finite_difference
  # finite_difference 模式下下面三项保留给旧 spline/fourier 配置，不参与当前数采。
  spline_smoothing_rad2: 1.0e-5
  fourier_fundamental_hz: 0.1
  fourier_harmonics: 8
  torque_lowpass_hz: 12.0
  torque_median_window: 3
  min_samples: 3
