# Independent configuration. Paths are relative to THIS file; no DP checkpoint.
pi0:
  anchor_camera: wrist  # action 时间原点使用该相机帧时间戳，与训练一致。
  host: localhost
  port: 8000
  prompt: "peel the deep green part on the cucumber surface"
  # prompt: "insert the USB into the port"
  # prompt: "push the button until the lamp light"
  action_hz: 25
  consume_steps: 50  # 消费上限；校准自动预留过期前缀，实际每段可能更短。
  output_key: actions
  quaternion_tolerance: 0.15
  interface:
    # Replace with the ACTUAL Nero EE-pose LoRA TrainConfig name on the server.
    # training_config: pi0_nero_lora_push_button
    # training_config: pi0_nero_lora_insert_usb
    training_config: pi0_nero_lora_cucumber_peeling
    state_key: observation/state
    prompt_key: prompt
    images: {side: observation/image, wrist: observation/wrist_image}
    state_semantic: observation.ee_pose
    action_semantic: action.ee_pose
    coordinate_frame: link7
    representation: xyz_quaternion
    quaternion_order: xyzw
    image_format: uint8_hwc_rgb
    output_space: physical_absolute
    action_hz: 25

wm:
  inference_mode: prefetch # openloop: 推一次执行一次；prefetch: 提前请求下一轮 WM。
  enable: true  # false: 跳过 WM，π0 末端绝对位姿经 IK 转为关节角开环执行。
  # PINN repo path and checkpont path 
  pinn_root: ../../../PINN
  # checkpoint: ../../../PINN/outputs/cwm_insert_usb_100hz_16step/checkpoints/step_00200000.pt
  checkpoint: ../../../PINN/outputs/test_policy/cwm_insert_usb_100hz_40step/checkpoints/step_00200000.pt
  # checkpoint: ../../../PINN/outputs/cwm_all_100hz_40step/checkpoints/step_00400000.pt
  # checkpoint: ../../../PINN/outputs/deterministic_wm_baseline_ep2/checkpoints/step_00028353.pt
  # checkpoint: ../../../PINN/outputs/cwm_teacher_policy/insert_usb_50h_40step/checkpoints/step_00200000.pt
  # checkpoint: ../../../PINN/outputs/cwm_teacher_policy/ucumber_peeling_50h_40step/checkpoints/step_00100000.pt
  device: cuda:0
  use_ema: true
  num_samples: 1
  selected_sample: 0
  flow_steps: 4
  solver: heun
  acceleration:
    enabled: false
    cache_condition_kv: false
    compile: false
    compile_mode: reduce-overhead

control:
  inference_runs: 50  # 运行轮数；i 或达到 maximum_steps 完成本轮，d 暂停不计数。
  wait_for_start: true  # s 开始/恢复，d 暂停，i 结束本轮并复位；Ctrl+C 退出程序。
  mode: mtc  # WM 开启时为 move_js；纯 Pi0（wm.enable=false）自动使用 MIT 柔顺跟踪。
  mtc:
    # 纯 Pi0（wm.enable=false）也默认通过 MIT 使用这组柔顺跟踪增益。
    kp: [6.0, 6.0, 6.0, 6.0, 5.0, 6.0, 6.0]
    # kd: [1, 1, 1, 1, 1, 1, 1]
    # kp: [4.0, 3.0, 4.0, 3.5, 5.0, 2.0, 3.0]   # q
    kd: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5]

    # t_ff = g(q_measured) + tau_scale * (tau_WM - g(q_WM))。
    # 不是实测力矩误差闭环；明显限幅时自动降低预测残差权重。
    tau_scale: [1, 1, 1, 1, 1, 1, 1]
    maximum_velocity_rad_s: 2.0
    maximum_acceleration_rad_s2: 2.0
    prediction_deviation_rad: 0.1
    feedforward_limit_nm: [12, 12, 10, 10, 5, 5, 5]
    total_torque_limit_nm: [12, 12, 10, 10, 5, 5, 5]
    maximum_torque_rate_nm_s: 20.0
    watchdog_timeout_s: 0.05
    urdf_path: ../../urdf/nero/nero_with_gripper.urdf
  hz: 100
  command_hz: 100  # 只降低下发频率，不改变 WM 的 100 Hz 预测时间轴。
  execute_steps: 8  # 每段执行步数；100 Hz 下 40 步=400 ms，模型预测长度不变。
  maximum_steps: 10000
  maximum_state_age_s: 0.1
  maximum_camera_age_s: 0.3

calibration:
  warmup_samples: 3
  minimum_samples: 3
  wm_seconds: 1.0
  pi_seconds: 1.0
  wm_margin_s: 0.02
  pi_margin_s: 0.08
  request_timeout_s: 30.0

hardware:
  backend: pyagx
  endpoint:
    name: follower
    # 与数采从臂一致；启动及按 i 退出时复位到此关节姿态（rad）。
    rest_q: [0.0, -0.14689, 0.0, 1.80020, 0.0, 0.02744, 1.50378]
    channel: can_slave
    interface: socketcan
    firmware: V120
  # Match the installed robot URDF; tighter limits may be configured.
  q_min: [-2.70526, -1.74, -2.75, -1.01, -2.75, -0.73, -1.5707963]
  q_max: [2.70526, 1.74, 2.75, 2.14, 2.75, 0.95, 1.5707963]
  maximum_step_rad: [0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02]

cameras:
  - name: side
    enabled: true
    visualize: true
    backend: v4l2
    serial_number: CC1N16200XL
    pixel_format: MJPG
    buffer_size: 1
    startup_timeout_s: 2.0
    frame_timeout_s: 0.5
    width: 640
    height: 480
    fps: 25
    exposure: 200
    # 保持自动曝光，但禁止相机通过延长曝光主动降低采集帧率。
    exposure_dynamic_framerate: false
    depth: false
    # crop: [0, null, 0, null]
    output_size: [256, 192]

  - name: wrist
    enabled: true
    # 数采和推理共用独立 GUI 进程显示最新帧；预览慢时丢旧帧，不阻塞控制。
    visualize: true
    backend: v4l2
    serial_number: CC1WC520122
    pixel_format: MJPG
    buffer_size: 1
    startup_timeout_s: 2.0
    frame_timeout_s: 0.5
    width: 640
    height: 480
    fps: 25
    exposure: 200
    # 保持自动曝光，但禁止相机通过延长曝光主动降低采集帧率。
    exposure_dynamic_framerate: false
    depth: false
    # crop: [0, null, 0, null]
    output_size: [256, 192]

  - name: side_2
    enabled: false
    visualize: true
    backend: v4l2
    serial_number: CC1N16202KT
    pixel_format: MJPG
    buffer_size: 1
    startup_timeout_s: 2.0
    frame_timeout_s: 0.5
    width: 640
    height: 480
    fps: 25
    exposure: 200
    exposure_dynamic_framerate: false
    depth: false
    output_size: [256, 192]

mujoco:
  enabled: false
  headless: false
  mujoco_model_path: ../../calibration/data/excitation_validation.scene.xml
  robot_joint_names: [joint1, joint2, joint3, joint4, joint5, joint6, joint7]
  ee_body_name: link7
  ee_site_name: null
  render_fps: 50
  prediction_visualization_hz: 100
  point_size: 0.003
