# 这里只配置部署参数。网络结构、shape_meta、horizon、normalizer 等均从 ckpt 恢复。
dp_checkpoint:
  # path: ../../../model/checkpoints/optimizer_step=00020000.ckpt
  # path: ../../../model/checkpoints0802/checkpoints/latest.ckpt
  path: ../../../model/checkpoints0805/latest.ckpt

  dino_model_path: ../../../model/dinov3-vitb16-pretrain-lvd1689m
  device: cuda:0
  use_ema: true

pinn_checkpoint:
  # predictor.enabled=false 时不会加载，也可以删除整个 pinn_checkpoint 配置块。
  # mode=world_model_v3/v4/v5 时填写对应 WM checkpoint；切回 wrench_gru 时换成 V1 checkpoint。
  # path: ../../../PINN/outputs/test/world_model_v3_step100k_debug/checkpoints/step_0020300_val_loss_0.615721.pt
  # path: ../../../PINN/outputs/world_model_v4/checkpoints/step_XXXXX_val_loss_XXXXXX.pt
  # path: ../../../PINN/outputs/test/wrench_sequence_v1_ep1/checkpoints/epoch_035_val_loss_0.022483.pt
  path: ../../../PINN/outputs/world_model_v5/checkpoints/step_0098900_val_loss_0.061793.pt
  device: cuda:0
  use_ema: true

predictor:
  # false: 不加载 F expert，DP action chunk 直接经 IK 转成 q 并下发机械臂。
  # true:  保持 predictor -> OSC-QP -> torque 的原链路。
  enabled: false

  # open_loop: 观测一次、同步 DP 推理一次，执行完整计划后再重新观测推理。
  # asynchronous: DP worker 持续使用新观测后台推理（兼容旧行为）。
  inference_mode: open_loop

  mode: world_model
 # first middle last all mean
  action_chunk_mode: middle
  # null 自动读取 DP checkpoint 的 task.dataset.timestamp_step_sec（当前为 0.1s）。
  action_step_s: null

  # chunk: 保持原 first/mean/all 执行；minimum_jerk_target: 选择一个目标，
  # 从当前末端位姿按零起止速度/加速度的五次时间曲线缓慢开环执行。
  action_execution_mode: minimum_jerk_target

  # 当前最大 5 cm/0.5 rad action 至少用 2 秒执行，避免 dq/ddq 突变污染 wrench。
  action_interpolation_duration_s: 1.0

  # 2 秒按 100 Hz CAN 控制周期离散为 200 段；包含起点和终点。
  action_interpolation_steps: 100

  # auto: V5 将最新 DP action 重复填满 PINN horizon，其他模型使用剩余 chunk。
  # hold: 强制保持最新 DP action；chunk: 使用并补齐剩余 action chunk。
  action_condition_fill: hold

dp_sampling:
  # 可选 ddim 或 ddpm；beta schedule 和训练扩散步数从 DP checkpoint 恢复。
  method: ddim
  num_inference_steps: 15

robot:
  urdf_path: ../../urdf/nero/nero_with_gripper.urdf
  frame_name: gripper_base
  # DP action 所属 frame；启用 predictor 时 checkpoint 内配置优先。
  action_frame_name: link7
  locked_joint_names: [gripper, gripper_joint1, gripper_joint2]

runtime:
  # 复用机械臂、相机、tau_f checkpoint、逆动力学和 wrench 映射配置。
  collection_config: ../../configs/master_slave_can.yaml
  arm_pair: main
  camera: wrist
  maximum_state_age_s: 0.1
  # 每个相机观测与最近 CAN 派生状态/力数据允许的最大时间戳误差。
  maximum_observation_alignment_gap_s: 0.03
  # 每个推理 episode 的最大控制步数；达到后复位并自动开始下一次推理。
  # null 表示不按步数自动切分，仍可按 i 手动结束当前 episode。
  maximum_inference_steps: 2000
  # MIT 附加关节阻尼；OSC-QP 输出作为 t_ff。
  command_kd: [0, 0, 0, 0, 0, 0, 0]

observation_protection:
  # 启动及每次 episode 复位后保持静止，持续采样 tau_f/wrench，满 2 秒才允许策略推理。
  enabled: true
  warmup_duration_s: 2.0
  # 5 点中值抑制孤立尖峰，再以一阶因果低通平滑输入 checkpoint 的 wrench。
  wrench_median_window: 5
  wrench_lowpass_cutoff_hz: 5.0

safety:
  maximum_action_translation_step_m: 0.05
  maximum_action_rotation_step_rad: 0.5
  maximum_target_force_n: 5.0
  maximum_target_moment_nm: 5.0
  maximum_command_torque_nm: [25, 25, 25, 20, 15, 10, 10]
  # direct IK 每个控制周期允许下发的最大关节位置变化。
  maximum_joint_position_step_rad: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5]

ik:
  max_iterations: 100
  position_tolerance_m: 0.0001
  rotation_tolerance_rad: 0.001
  damping: 0.001
  step_gain: 1.0
  maximum_iteration_step_rad: 0.2
  joint_position_margin_rad: 0.02

torque_filter:
  enabled: false
  # 奇数窗口；3 可剔除孤立的单周期尖峰，但会带来约一个控制周期的额外延迟。
  median_window: 3
  # 一阶因果低通；null 表示关闭低通。
  lowpass_cutoff_hz: 15.0
  # 最终硬变化率限制，单位 N.m/s；可填写标量、7 维数组或 null。
  rate_limit_nm_s: [50, 50, 50, 40, 30, 20, 20]

wrench_visualization:
  # 独立进程绘制四张图：原始/处理后的合力和六维分量，不阻塞控制循环。
  # 处理曲线使用 observation_protection 的低通和 DP checkpoint 的接触门控。
  enabled: true
  window_s: 10.0
  update_rate_hz: 20.0

timing:
  enabled: true
  report_interval_s: 1.0

osc_qp:
  horizon_steps: 10
  # 仅为首周期启动值；后续由相邻状态 timestamp 的实测周期更新，不用于 sleep。
  dt_s: 0.01
  pose_kp: [1.0, 1.0, 2.0, 2.0, 1.0, 1.0]
  pose_kd: [0.10, 0.10, 0.25, 0.80, 0.10, 0.10]
  pose_weight: [40, 40, 40, 12, 12, 12]
  wrench_weight: [8, 8, 8, 2, 2, 2]
  acceleration_weight: 0.001
  torque_weight: 0.0002
  torque_rate_weight: 0.002
  wrench_rate_weight: 0.001
  force_feedback_gain: [0.5, 0.5, 0.5, 0.2, 0.2, 0.2]
  acceleration_limit: 20.0
  torque_limit: [2, 2, 25, 20, 15, 10, 10]
  wrench_lower: [-10, -10, -10, -10, -10, -10]
  wrench_upper: [10, 10, 10, 10, 10, 10]
  joint_position_margin_rad: 0.02
  friction_coefficient: null
  contact_normal_axis: 2
  osqp_max_iter: 4000
  osqp_eps_abs: 0.00001
  osqp_eps_rel: 0.00001
  osqp_polish: false
  maximum_constraint_violation: 0.005
