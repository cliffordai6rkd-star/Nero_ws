name: dp
channels:
  - conda-forge
dependencies:
  # Match nero_ws/environment.yml so collection and training agree on array,
  # HDF5, camera, and dynamics ABI boundaries.
  - python=3.10
  - pip
  - numpy>=2.2,<2.3
  - h5py>=3.11
  - pyyaml>=6.0
  - opencv>=4.9,<4.13
  - matplotlib>=3.7
  - mujoco>=3.3,<4
  - pinocchio>=3,<4
  - scipy>=1.10,<1.16
  - pip:
      - -e .[training,test]

# LeRobot 0.4.0 currently declares an older torch upper bound than the CUDA
# training image. Install it after environment creation without dependency
# resolution: python -m pip install --no-deps lerobot==0.4.0
